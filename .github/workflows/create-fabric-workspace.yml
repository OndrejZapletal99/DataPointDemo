name: Create Fabric Workspace
on:
  workflow_dispatch:

jobs:
  create_workspace:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install Fabric CLI
        run: |
          pip install ms-fabric-cli
      
      - name: Fabric CLI Login with Service Principal
        run: |
          fab config set encryption_fallback_enabled true
          fab auth login --u '${{ secrets.FABRIC_CLIENT_ID }}' \
                       --p '${{ secrets.FABRIC_CLIENT_SECRET }}' \
                       --tenant '${{ secrets.FABRIC_TENANT_ID }}'
      
      - name: Create Fabric Workspace
        run: |
          fab create WS-fabricUser-008-test.workspace -P capacityname=Trial-20260528T115331Z-Cqa8ZJ8YL0yRXYMkueDxXw
        env:
          FABRIC_USER_ID: ${{ secrets.FABRIC_CLIENT_ID }}
      
      - name: Set Workspace Permissions
        run: |
          echo y | fab acl set WS-fabricUser-008-test.workspace -I 7598817c-573e-41c2-8359-094c935e307f -R contributor
      
      - name: Verify Workspace Creation
        run: |
          fab get WS-fabricUser-008-test.workspace